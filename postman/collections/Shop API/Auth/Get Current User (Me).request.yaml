$kind: http-request
name: 'Get Current User (Me)'
method: GET
url: '{{base_url}}/api/auth/me/'
order: 7000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200 OK", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Response has user fields", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("id");
          pm.expect(json).to.have.property("username");
          pm.expect(json).to.have.property("email");
          pm.expect(json).to.have.property("is_staff");
      });
      pm.test("Password is not exposed", function () {
          const json = pm.response.json();
          pm.expect(json).to.not.have.property("password");
      });
