$kind: http-request
name: Login - Wrong Password
method: POST
url: '{{base_url}}/api/auth/token/'
order: 5000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "username": "testuser",
      "password": "WrongPassword!"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 401 for wrong credentials", function () {
          pm.response.to.have.status(401);
      });
