$kind: http-request
name: Refresh Token
method: POST
url: '{{base_url}}/api/auth/token/refresh/'
order: 6000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: '{"refresh": "{{refresh_token}}"}'
auth:
  type: noauth
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200 OK", function () {
          pm.response.to.have.status(200);
      });
      pm.test("New access token returned", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("access");
          pm.environment.set("access_token", json.access);
      });
