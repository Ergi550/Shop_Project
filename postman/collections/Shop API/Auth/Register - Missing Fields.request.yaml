$kind: http-request
name: Register - Missing Fields
method: POST
url: '{{base_url}}/api/auth/register/'
order: 3000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "nopassword@example.com"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 400 for missing fields", function () {
          pm.response.to.have.status(400);
      });
      pm.test("Error detail is present", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("detail");
      });
