$kind: http-request
name: Create Order - Unauthenticated
method: POST
url: '{{base_url}}/api/orders/create/'
order: 6000
auth:
  type: noauth
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "shipping_full_name": "Test User",
      "shipping_address": "123 Main Street",
      "shipping_city": "London",
      "shipping_postcode": "SW1A 1AA",
      "shipping_country": "UK",
      "items": [{"variant": 1, "quantity": 1}]
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 401 when not authenticated", function () {
          pm.response.to.have.status(401);
      });
