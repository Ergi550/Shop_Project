$kind: http-request
name: List My Orders - Unauthenticated
method: GET
url: '{{base_url}}/api/orders/'
order: 2000
auth:
  type: noauth
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 401 when not authenticated", function () {
          pm.response.to.have.status(401);
      });
